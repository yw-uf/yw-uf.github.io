<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="title desc"><title id="title">Assured autonomy</title><desc id="desc">A conceptual trajectory reaches its goal while avoiding an obstacle, supported by learning, logic, and control.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c7d5ca" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m0 0 10 5-10 5" fill="none" stroke="#245462" stroke-width="1.5"/></marker></defs><rect width="560" height="470" fill="#e9eeea"/><rect x="28" y="28" width="504" height="365" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#31525b"><text x="44" y="56" font-size="9" letter-spacing="2">A PATH FROM INTENT TO ACTION</text><text x="44" y="78" font-size="9" fill="#6b7d75">CONCEPTUAL PLANNING ENVIRONMENT</text></g><path d="M72 326C120 260 137 291 179 248S207 124 298 140 327 279 406 212 462 161 480 107" stroke="#8aaca1" stroke-width="34" opacity=".2" fill="none"/><path d="M73 326C110 321 165 183 242 247S358 295 480 107" stroke="#aabbb2" stroke-width="1.5" stroke-dasharray="5 7" fill="none"/><rect x="269" y="216" width="86" height="83" rx="2" fill="#ccd7cd" stroke="#9aad9f"/><path d="m269 216 86 83m-86 0 86-83" stroke="#b5c4b8" stroke-width="1"/><text x="312" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="1" fill="#61796c">OBSTACLE</text><path d="M72 326C120 260 137 291 179 248S207 124 298 140 327 279 406 212 462 161 480 107" stroke="#245462" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g fill="#e9eeea" stroke="#245462" stroke-width="2"><circle cx="72" cy="326" r="5"/><circle cx="179" cy="248" r="4"/><circle cx="298" cy="140" r="4"/><circle cx="406" cy="212" r="4"/></g><circle cx="480" cy="107" r="15" fill="#ec8455" opacity=".25"/><circle cx="480" cy="107" r="